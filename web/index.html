<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nomen</title>
<style>
:root { color-scheme: dark; --bg:#0e1116; --panel:#141821; --line:#232935; --text:#e8eaef; --muted:#8b93a3; --dim:#5b6372;
  --blue:#4a9eff; --green:#3ecf8e; --amber:#f5b641; --red:#f87171; --gold:#e9c46a; }
* { box-sizing:border-box; margin:0; padding:0; }
html, body { height:100%; }
body { font-family: Inter, system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--text); overflow:hidden; }
#root { height:100vh; display:flex; flex-direction:column; }
header { display:flex; align-items:center; gap:1.2rem; padding:.8rem 1.4rem; border-bottom:1px solid var(--line); background:var(--panel); flex-shrink:0; }
header .brand { display:flex; align-items:baseline; gap:.7rem; }
header .brand h1 { font-size:1.15rem; font-weight:700; letter-spacing:-.01em; }
header .brand .tag { color:var(--muted); font-size:.86rem; }
.kpis { margin-left:auto; display:flex; gap:.6rem; flex-wrap:wrap; }
.change { margin:.9rem 1.4rem 0; padding:.6rem .9rem; border:1px solid #6b5a1f; background:#2b2510; color:#f1e3b0; border-radius:9px; font-size:.86rem; line-height:1.5; }
.change b { color:var(--gold); } .change .x { float:right; cursor:pointer; color:var(--muted); margin-left:.8rem; }
@media (max-width:700px){ header { flex-wrap:wrap; } .kpi { min-width:0; } table.tax th, table.tax td { padding-left:.6rem !important; padding-right:.6rem !important; } .toolrow { flex-wrap:wrap; } }
.kpi { background:#0f1319; border:1px solid var(--line); border-radius:10px; padding:.45rem .8rem; min-width:118px; }
.kpi .n { font-size:1.15rem; font-weight:700; font-variant-numeric:tabular-nums; }
.kpi .l { font-size:.68rem; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-top:.1rem; }
.kpi.warn .n { color:var(--amber); }
nav.tabs { display:flex; gap:.2rem; padding:.45rem 1.4rem 0; border-bottom:1px solid var(--line); background:var(--panel); flex-shrink:0; }
nav.tabs button { background:none; border:none; color:var(--muted); font:600 .9rem Inter, system-ui; padding:.55rem .9rem; cursor:pointer; border-bottom:2px solid transparent; }
nav.tabs button.on { color:var(--text); border-bottom-color:var(--blue); }
nav.tabs button .step { color:var(--dim); font-weight:500; margin-right:.4rem; }
nav.tabs a { margin-left:auto; color:var(--muted); font-size:.86rem; align-self:center; text-decoration:none; padding:.5rem .6rem; }
nav.tabs a:hover { color:var(--text); }
.main { position:relative; flex:1; min-height:0; display:flex; }
.content { flex:1; min-width:0; overflow:auto; }
.lede { padding:.9rem 1.4rem .4rem; color:var(--muted); font-size:.9rem; line-height:1.5; max-width:980px; }
.lede b { color:var(--text); }
.toolrow { display:flex; align-items:center; gap:.6rem; padding:.5rem 1.4rem .7rem; flex-wrap:wrap; }
input.tin { background:#0f1319; border:1px solid var(--line); border-radius:9px; color:var(--text); font:.9rem Inter, system-ui; padding:.45rem .75rem; outline:none; }
input.tin:focus { border-color:var(--blue); }
button.btn { background:#0f1319; border:1px solid var(--line); color:var(--text); border-radius:9px; font:.85rem Inter, system-ui; padding:.42rem .8rem; cursor:pointer; }
button.btn:hover { border-color:var(--blue); }
button.btn.primary { background:#1b3f6b; border-color:#2f6aa8; color:#e3efff; }
button.btn.ghost { background:transparent; color:var(--muted); }
button.btn:disabled { opacity:.5; cursor:default; }
.seg { display:inline-flex; border:1px solid var(--line); border-radius:9px; overflow:hidden; }
.seg button { background:#0f1319; border:none; color:var(--muted); font:.85rem Inter, system-ui; padding:.42rem .8rem; cursor:pointer; }
.seg button.on { background:#1b3f6b; color:#e3efff; }
.chip { display:inline-flex; align-items:center; gap:.35rem; padding:.22rem .6rem; border-radius:20px; font-size:.78rem; border:1px solid var(--line); background:#0f1319; color:var(--muted); cursor:pointer; }
.chip:hover { border-color:var(--blue); color:var(--text); }
.chip.anchor { background:#2b2510; border-color:#6b5a1f; color:var(--gold); }
.chip .x { opacity:.7; } .chip .x:hover { opacity:1; }
table.tax { width:100%; border-collapse:collapse; font-size:.88rem; }
table.tax th { position:sticky; top:0; background:var(--panel); color:var(--muted); text-align:left; font-weight:600; font-size:.72rem; text-transform:uppercase; letter-spacing:.05em; padding:.55rem 1.4rem .55rem .9rem; border-bottom:1px solid var(--line); z-index:2; cursor:pointer; }
table.tax th:first-child { padding-left:1.4rem; }
table.tax tbody tr { border-bottom:1px solid #171b23; cursor:pointer; }
table.tax tbody tr:hover { background:#161b24; }
table.tax tbody tr.sel { background:#172238; }
table.tax td { padding:.5rem .9rem; vertical-align:middle; }
table.tax td:first-child { padding-left:1.4rem; }
td.name { color:var(--text); white-space:nowrap; }
td.name .tw { display:inline-block; width:1rem; color:var(--dim); font-size:.75rem; }
td.name .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:.5rem; vertical-align:baseline; }
td.num { text-align:right; color:#c6cbd6; font-variant-numeric:tabular-nums; width:90px; }
td.bench { color:var(--muted); }
.meter { display:flex; align-items:center; gap:.5rem; }
.meter .bar { width:84px; height:7px; background:#1d222c; border-radius:4px; overflow:hidden; }
.meter .bar > span { display:block; height:100%; }
.meter .v { width:46px; text-align:right; color:#c6cbd6; font-variant-numeric:tabular-nums; font-size:.84rem; }
.lvl { display:inline-block; font-size:.7rem; padding:.08rem .45rem; border-radius:6px; margin-left:.4rem; }
.lvl.tight { background:#113524; color:var(--green); } .lvl.mixed { background:#3a2d10; color:var(--amber); } .lvl.loose { background:#3a1a1a; color:var(--red); }
.hbadge { font-size:.66rem; color:var(--gold); border:1px solid #6b5a1f; border-radius:5px; padding:.03rem .32rem; margin-left:.45rem; vertical-align:middle; }
.fail { color:var(--red); }
.panel { width:420px; flex-shrink:0; border-left:1px solid var(--line); background:var(--panel); overflow-y:auto; padding:1.1rem 1.2rem; }
.panel h2 { font-size:1.1rem; margin:.1rem 0 .3rem; line-height:1.3; }
.panel .eyebrow { font-size:.7rem; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
.panel .close { float:right; cursor:pointer; color:var(--muted); font-size:1.25rem; background:none; border:none; }
.panel .row { margin:.95rem 0; }
.panel .label { font-size:.72rem; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-bottom:.35rem; }
.editrow { display:flex; gap:.4rem; } .editrow input { flex:1; }
.kv { display:flex; justify-content:space-between; font-size:.88rem; margin:.28rem 0; } .kv .v { font-weight:600; }
.sample { font-size:.8rem; color:#c0c6d2; line-height:1.45; background:#0f1319; border:1px solid var(--line); border-radius:8px; padding:.55rem .65rem; margin:.4rem 0; }
details.bench { margin-top:.6rem; } details.bench summary { cursor:pointer; color:var(--muted); font-size:.78rem; }
.goldrow { display:flex; align-items:center; gap:.5rem; margin:.3rem 0; font-size:.8rem; }
.goldrow .gbar { flex:1; height:6px; background:#1d222c; border-radius:3px; overflow:hidden; } .goldrow .gbar>span { display:block; height:100%; background:#e9c46aaa; }
.goldrow .gname { width:140px; color:#c6cbd6; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .goldrow .gcount { color:var(--muted); width:44px; text-align:right; }
.cards { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:.7rem; padding:.2rem 1.4rem .6rem; max-width:1100px; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:.8rem .95rem; }
.card .n { font-size:1.6rem; font-weight:700; font-variant-numeric:tabular-nums; line-height:1.1; }
.card .l { font-size:.74rem; color:var(--muted); margin-top:.3rem; line-height:1.35; }
.card.good { border-color:#1f5c3d; } .card.good .n { color:var(--green); }
.card.bad .n { color:var(--amber); }
.resrow { display:grid; grid-template-columns:52px 1fr 180px; gap:.8rem; align-items:start; padding:.6rem 1.4rem; border-bottom:1px solid #171b23; font-size:.86rem; }
.resrow .sc { color:var(--muted); font-variant-numeric:tabular-nums; font-size:.8rem; padding-top:.15rem; }
.resrow .tx { color:#d3d8e2; line-height:1.45; } .resrow .tx mark { background:#3a2d10; color:#f5d98a; padding:0 .1rem; }
.resrow .lf { font-size:.78rem; color:var(--muted); } .resrow .lf b { color:var(--text); font-weight:600; display:block; }
.novel { padding:.4rem 1.4rem 1.4rem; max-width:1100px; }
.anomrow { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:.65rem .8rem; margin:.55rem 0; }
.anomrow .meta { display:flex; gap:.6rem; font-size:.74rem; color:var(--muted); margin-bottom:.4rem; flex-wrap:wrap; }
.anomrow .ctext { font-size:.84rem; color:#c9ced8; line-height:1.45; margin-bottom:.5rem; }
.anomrow .seed { display:flex; gap:.4rem; } .anomrow .seed input { flex:1; }
.busy { position:absolute; inset:0; z-index:40; display:flex; flex-direction:column; gap:.6rem; align-items:center; justify-content:center; background:rgba(9,11,15,.76); backdrop-filter:blur(3px); color:#e3efff; font-size:.95rem; }
.spinner { width:34px; height:34px; border:3px solid #26324a; border-top-color:var(--blue); border-radius:50%; animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg) } }
.hint { font-size:.8rem; color:var(--dim); padding:.6rem 1.4rem; }
.err { color:var(--red); }
#graph { position:absolute; inset:0; }
/* the Map fills what is left under the lede and the toolbar (height:100% overflowed the pane by their height and hid the bottom of the graph) */
.content:has(> .graphwrap) { display:flex; flex-direction:column; overflow:hidden; }
.graphwrap { position:relative; flex:1; min-height:0; }
nav.tabs { overflow-x:auto; scrollbar-width:none; } nav.tabs button, nav.tabs a { white-space:nowrap; flex-shrink:0; }
.how { padding:.4rem 1.4rem 2.4rem; max-width:900px; }
.how .intro { font-size:1.02rem; line-height:1.55; color:var(--text); margin:.5rem 0 1rem; }
.how section { border-top:1px solid var(--line); padding:1.05rem 0 .3rem; }
.how h3 { font-size:.98rem; font-weight:650; margin-bottom:.45rem; display:flex; align-items:baseline; gap:.55rem; }
.how h3 .k { color:var(--dim); font-weight:500; font-size:.8rem; font-variant-numeric:tabular-nums; }
.how p { color:#c6cbd6; font-size:.9rem; line-height:1.6; margin:.35rem 0 .55rem; }
.how p b { color:var(--text); } .how .note { color:var(--muted); font-size:.82rem; }
.how .tv { color:var(--text); font-weight:600; font-variant-numeric:tabular-nums; }
.how .eq { display:flex; flex-wrap:wrap; align-items:center; gap:.55rem; margin:.5rem 0 .7rem; font-size:.86rem; color:var(--muted); }
.how .eq .term { background:#0f1319; border:1px solid var(--line); border-radius:9px; padding:.4rem .7rem; }
.how .eq .term b { display:block; color:var(--text); font-size:1.05rem; font-variant-numeric:tabular-nums; }
.how .eq .term.good b { color:var(--green); }
.how .levels { display:flex; flex-wrap:wrap; gap:.4rem 1rem; margin:.4rem 0 .6rem; } .how .levels .li { display:inline-flex; align-items:center; gap:.4rem; white-space:nowrap; } .how .levels .lvl { margin-left:0; }
.how .steps { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:.7rem; margin:.6rem 0; }
.how .step-card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:.8rem .95rem; }
.how .step-card h4 { font-size:.92rem; margin-bottom:.35rem; } .how .step-card h4 .k { color:var(--dim); font-weight:500; margin-right:.4rem; }
.how .step-card p { font-size:.84rem; margin:.2rem 0; }
.how .step-card a { color:var(--blue); font-size:.82rem; text-decoration:none; cursor:pointer; }
.flow { width:100%; height:auto; display:block; margin:.4rem 0 .6rem; }
.flow .box { fill:var(--panel); stroke:var(--line); stroke-width:1.2; }
.flow .box.you { stroke:#6b5a1f; fill:#2b2510; }
.flow .t { fill:var(--text); font:600 14px Inter, system-ui, sans-serif; }
.flow .s { fill:var(--muted); font:12px Inter, system-ui, sans-serif; }
.flow .n { fill:var(--blue); font:700 12px Inter, system-ui, sans-serif; }
.flow .you .t, .flow text.you { fill:var(--gold); }
.flow .arrow { stroke:var(--dim); stroke-width:1.6; fill:none; }
.flow .loop { stroke:var(--gold); stroke-width:1.4; fill:none; stroke-dasharray:5 4; }
.flow-v { display:none; }
@media (max-width:700px){ nav.tabs { padding:.45rem .5rem 0; gap:0; flex-wrap:wrap; overflow-x:visible; } nav.tabs button { padding:.55rem .55rem; } nav.tabs a { padding:.5rem .5rem; }
  .panel { position:absolute; inset:0; width:auto; z-index:30; border-left:none; }
  td.name { white-space:normal; } td.num { width:auto; } .meter .bar { width:44px; } .meter .v { width:auto; } .lvl { margin-left:0; }
  .flow-h { display:none; } .flow-v { display:block; max-width:360px; } .how .steps { grid-template-columns:1fr; } .how { padding-left:1rem; padding-right:1rem; } }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm/dist/htm.umd.js"></script>
<script src="//cdn.jsdelivr.net/npm/3d-force-graph"></script>
<script>
const { useState, useEffect, useRef, useMemo } = React;
const html = htm.bind(React.createElement);
const BRANCH = ['#4a9eff','#f472b6','#3ecf8e','#fb923c','#a78bfa','#2dd4bf','#a3e635','#f87171','#38bdf8','#fb7185'];   // no gold: gold = named by you
const TABS = ['discover','correct','find','how'];
const EXAMPLES = ['governing law','indemnification','confidentiality','notices','severability','base salary','counterparts'];
const branchIndex = id => { const m=String(id).match(/[_](\d+)/); return m?(+m[1])%BRANCH.length:0; };
const colorFor = n => n.depth===0 ? '#e8eaef' : (n.human_named ? '#e9c46a' : BRANCH[branchIndex(n.id)]);
let TH = {lo:0.80, hi:0.90};  // replaced by the leaf tertiles once the tree loads
const level = c => c==null ? null : (c>=TH.hi ? ['tight','#3ecf8e'] : c>=TH.lo ? ['mixed','#f5b641'] : ['loose','#f87171']);
const pct = c => Math.round(100*Math.max(0, Math.min(1, (c-(TH.lo-0.12))/((TH.hi+0.06)-(TH.lo-0.12)))));
const fmt = n => (n==null ? '—' : Number(n).toLocaleString());
async function post(route, body){
  const r = await fetch(route, {method:'POST', headers:{'Content-Type':'application/json','ngrok-skip-browser-warning':'1'}, body:JSON.stringify(body||{})});
  const d = await r.json(); if(!r.ok || d.error) throw new Error(d.error||('HTTP '+r.status)); return d;
}
function Meter({value, color}){ return html`<div class="meter"><span class="bar"><span style=${{width:Math.max(0,Math.min(100,value))+'%', background:color}}></span></span><span class="v">${value==null?'—':value}</span></div>`; }

function Panel({node, onClose, onRename, busy, showBench}){
  const [name,setName] = useState('');
  useEffect(()=>{ setName(node?node.name:''); },[node&&node.id, node&&node.name]);
  if(!node) return null;
  const lv = level(node.cohesion);
  return html`<div class="panel">
    <button class="close" onClick=${onClose}>×</button>
    <div class="eyebrow">${node.depth===0?'corpus':(String(node.id).startsWith('A_')?'your concept':(node._hasChildren?'branch':'concept'))}${node.human_named?html`<span class="hbadge">named by you</span>`:''}</div>
    <h2>${node.name}</h2>
    ${node.depth>0 && html`<div class="row">
      <div class="label">rename: the whole corpus re-clusters around your word</div>
      <div class="editrow">
        <input class="tin" value=${name} onInput=${e=>setName(e.target.value)} onKeyDown=${e=>{ if(e.key==='Enter'&&name.trim()) onRename(node.id,name.trim()); }}/>
        <button class="btn primary" disabled=${busy||!name.trim()} onClick=${()=>onRename(node.id,name.trim())}>Rename</button>
      </div></div>`}
    <div class="row">
      <div class="kv"><span>clauses</span><span class="v">${fmt(node.count)}</span></div>
      ${node.cohesion!=null && !node._hasChildren && html`<div class="kv"><span>coherence</span><span class="v" style=${{color:lv[1]}}>${node.cohesion} · ${lv[0]}</span></div>`}
      ${node.cohesion!=null && !node._hasChildren && html`<div class="hint" style=${{padding:'.2rem 0 0'}}>coherence is measured before any model reads the text. Across the corpus, the tightest clusters are right 98% of the time, the loosest 79%; tight / mixed / loose are the top, middle and bottom third of the concepts.</div>`}
      ${node.count===0 && html`<div class="hint" style=${{padding:'.3rem 0 0'}}>empty: no clause is close enough to this word yet.</div>`}
    </div>
    ${node.samples && node.samples.length>0 && html`<div class="row">
      <div class="label">the clauses the name came from</div>
      ${node.samples.slice(0,4).map((s,i)=> html`<div class="sample" key=${i}>${s}…</div>`)}</div>`}
    ${showBench && node.count>0 && html`<details class="bench" open>
      <summary>benchmark check (labels the product never sees)</summary>
      <div class="kv" style=${{marginTop:'.5rem'}}><span>most common true type</span><span class="v">${node.gold_dominant}</span></div>
      <div class="kv"><span>purity</span><span class="v">${node.purity}%</span></div>
      ${node.gold_top3 && node.gold_top3.map((t,i)=> html`<div class="goldrow" key=${i}><span class="gname" title=${t[0]}>${t[0]}</span><span class="gbar"><span style=${{width:(100*t[1]/node.gold_top3[0][1])+'%'}}></span></span><span class="gcount">${t[1]}</span></div>`)}
    </details>`}
  </div>`;
}

function Discover({data, sel, onSelect, showBench, setShowBench, view, setView, mount, q, setQ}){
  const [open,setOpen] = useState(()=>new Set());
  const [sort,setSort] = useState('tree');
  const childIds = useMemo(()=> new Set(data.links.map(l=>l.source)), [data]);
  const kids = useMemo(()=>{ const m={}; data.links.forEach(l=>{ (m[l.source]=m[l.source]||[]).push(l.target); }); return m; }, [data]);
  const byId = useMemo(()=> Object.fromEntries(data.nodes.map(n=>[n.id,n])), [data]);
  const toggle = id => setOpen(s=>{ const t=new Set(s); t.has(id)?t.delete(id):t.add(id); return t; });
  const s = q.trim().toLowerCase();
  const matches = n => !s || (n.name||'').toLowerCase().includes(s) || (n.gold_dominant||'').toLowerCase().includes(s);
  let rows = [];
  if(sort==='tree'){
    const walk = (id, depth) => { (kids[id]||[]).forEach(cid => { const n=byId[cid]; if(!n) return; rows.push(n);
      if(open.has(cid) || s) walk(cid, depth+1); }); };
    walk('root', 1);
    if(s) rows = rows.filter(matches);
  } else {
    rows = data.nodes.filter(n=>n.depth>0 && !childIds.has(n.id) && matches(n));
    const key = sort==='coh' ? (n=>-(n.cohesion??-1)) : sort==='size' ? (n=>-(n.count||0)) : (n=>-(n.purity||0));
    rows.sort((a,b)=>key(a)-key(b));
  }
  const rep = data.report;
  return html`<${React.Fragment}>
    <div class="lede">Nobody labelled these ${fmt(rep.n_provisions)} clauses. Nomen grouped them by meaning into <b>${rep.n_leaves} concepts</b> and named each one. <b>Coherence</b> says how far to trust a name.</div>
    <div class="toolrow">
      <div class="seg"><button class=${view==='table'?'on':''} onClick=${()=>setView('table')}>Tree</button><button class=${view==='graph'?'on':''} onClick=${()=>setView('graph')}>Map</button></div>
      <input class="tin" style=${{width:'220px'}} placeholder="filter concepts…" value=${q} onInput=${e=>setQ(e.target.value)}/>
      <div class="seg"><button class=${sort==='tree'?'on':''} onClick=${()=>setSort('tree')}>by branch</button><button class=${sort==='coh'?'on':''} onClick=${()=>setSort('coh')}>by coherence</button><button class=${sort==='size'?'on':''} onClick=${()=>setSort('size')}>by size</button></div>
      <label class="chip" style=${{marginLeft:'auto'}}><input type="checkbox" checked=${showBench} onChange=${e=>setShowBench(e.target.checked)}/> show benchmark labels</label>
    </div>
    ${view==='graph' ? html`<div class="graphwrap"><div id="graph" ref=${mount}></div><div class="hint" style=${{position:'absolute',bottom:0}}>drag to rotate · wheel to zoom · click a node</div></div>` : html`
    <table class="tax"><thead><tr><th>concept (named by the model)</th><th style=${{textAlign:'right'}}>clauses</th><th>coherence</th>${showBench&&html`<th>true type · purity</th>`}</tr></thead>
    <tbody>${rows.map(n=>{ const isLeaf=!childIds.has(n.id); const lv=level(n.cohesion); const indent=sort==='tree'?(n.depth-1):0; return html`
      <tr key=${n.id} class=${sel&&sel.id===n.id?'sel':''} onClick=${()=>onSelect(n)}>
        <td class="name" style=${{paddingLeft:(1.4+indent*1.3)+'rem'}}>
          <span class="tw" onClick=${e=>{ if(!isLeaf){ e.stopPropagation(); toggle(n.id);} }}>${isLeaf?'':(open.has(n.id)||s?'▾':'▸')}</span>
          <span class="dot" style=${{background:colorFor(n)}}></span>${n.name==='[naming failed]'?html`<span class="fail">unnamed (model failed)</span>`:(n.name.endsWith(' (auto)')?html`${n.name.slice(0,-7)}<span class="hbadge" style=${{color:'var(--amber)',borderColor:'#6b4f1f'}}>auto-named</span>`:n.name)}
          ${n.human_named && html`<span class="hbadge">yours</span>`}
        </td>
        <td class="num">${fmt(n.count)}</td>
        <td>${n.cohesion==null ? '—' : isLeaf ? html`<div class="meter"><span class="bar"><span style=${{width:pct(n.cohesion)+'%', background:lv[1]}}></span></span><span class="v">${n.cohesion}</span><span class=${'lvl '+lv[0]}>${lv[0]}</span></div>` : html`<span style=${{color:'var(--dim)',fontSize:'.8rem'}}>${(kids[n.id]||[]).length} sub-concepts</span>`}</td>
        ${showBench && html`<td class="bench">${n.count?html`${n.gold_dominant} · ${n.purity}%`:'—'}</td>`}
      </tr>`; })}
    </tbody></table>`}
  <//>`;
}

function AnomRow({a, onAnchor, busy}){

function Find({onOpenLeaf}){
  const [q,setQ]=useState(''), [res,setRes]=useState(null), [busy,setBusy]=useState(false), [err,setErr]=useState(null);
  const run = async (query) => { const qq=(query??q).trim(); if(!qq) return; setQ(qq); setBusy(true); setErr(null);
    try { const r = await fetch('/api/score?q='+encodeURIComponent(qq)+'&top=25', {headers:{'ngrok-skip-browser-warning':'1'}}); const d=await r.json(); if(d.error) throw new Error(d.error); setRes(d); }
    catch(e){ setErr(e.message); } finally { setBusy(false); } };
  const hl = (t, kw) => { if(!kw) return t; const i=t.toLowerCase().indexOf(kw.toLowerCase()); if(i<0) return t; return html`${t.slice(0,i)}<mark>${t.slice(i,i+kw.length)}</mark>${t.slice(i+kw.length)}`; };
  return html`<${React.Fragment}>
    <div class="lede">Type what you are looking for. Clauses are ranked by meaning, so paraphrases count. The cards compare that with a search for the same words.</div>
    <div class="toolrow">
      <input class="tin" style=${{width:'340px'}} placeholder="a concept, e.g. governing law" value=${q} onInput=${e=>setQ(e.target.value)} onKeyDown=${e=>{ if(e.key==='Enter') run(); }}/>
      <button class="btn primary" disabled=${busy||!q.trim()} onClick=${()=>run()}>Find</button>
      ${EXAMPLES.map(x=> html`<span class="chip" key=${x} onClick=${()=>run(x)}>${x}</span>`)}
    </div>
    ${err && html`<div class="hint err">${err}</div>`}
    ${busy && html`<div class="hint">ranking ${fmt(60000)} clauses…</div>`}
    ${res && res.gold_label && html`<div class="cards">
      <div class="card good"><div class="n">${fmt(res.semantic_found_at_90)}</div><div class="l">of the ${fmt(res.gold_count)} <b>${res.gold_label}</b> clauses found by meaning, all within the top ${fmt(res.semantic_to_90)} (precision ${res.semantic_precision_at_90}%)</div></div>
      <div class="card bad"><div class="n">${fmt(res.keyword_hits)}</div><div class="l">found by searching the words “${res.query}”: ${res.keyword_recall}% of them, in ${fmt(res.keyword_matches)} matches</div></div>
      ${res.keyword_recall>=90 && html`<div class=${'card '+(res.times_fewer>=3?'good':'')}><div class="n">${res.times_fewer}×</div><div class="l">fewer clauses to read than the word search, at 90% found</div></div>`}
      <div class="card"><div class="n">${fmt(res.gold_count)}</div><div class="l">such clauses exist (benchmark count, used only to score)</div></div>
    </div>`}
    ${res && !res.gold_label && html`<div class="hint">no benchmark label matches "${res.query}", so recall cannot be scored; the ranking below still works.</div>`}
    ${res && html`<div class="toolrow" style=${{paddingTop:0}}><span style=${{color:'var(--muted)',fontSize:'.82rem'}}>where the top 200 live:</span>${res.leaves_in_top200.map(([n,c])=> html`<span class="chip" key=${n} onClick=${()=>onOpenLeaf(n)}>${n==='[naming failed]'?'unnamed group':n} · ${c}</span>`)}</div>`}
    ${res && res.results.map(r=> html`<div class="resrow" key=${r.idx}><span class="sc">${r.score}</span><div class="tx">${hl(r.text, res.query)}…</div><div class="lf"><b>${r.leaf==='[naming failed]'?'unnamed group':(r.leaf||'—')}</b>${r.keyword_hit?'keyword would find it':'no keyword match'}</div></div>`)}
  <//>`;
}

// The mechanism as a diagram: same five stages, laid out across (wide) or down (phone).
function Flow({stages, you, vertical}){
  const W = vertical ? 250 : 150, Hh = vertical ? 66 : 92, gap = vertical ? 20 : 26, x0 = 10, y0 = 10;
  const pos = i => vertical ? [x0, y0 + i*(Hh+gap)] : [x0 + i*(W+gap), y0];
  const last = stages.length;
  const youXY = vertical ? pos(last) : [pos(2)[0] - (W+gap)/2, y0 + Hh + 62];
  const youW = vertical ? W : 2*W + gap, youH = vertical ? Hh : 58;
  const vbW = vertical ? 330 : x0*2 + last*W + (last-1)*gap, vbH = youXY[1] + youH + 12;
  const box = (x, y, w, h, lines, k, cls) => html`<g class=${cls||''} key=${k}>
    <rect class=${'box '+(cls||'')} x=${x} y=${y} width=${w} height=${h} rx="10"/>
    ${lines.map((l,j)=> html`<text key=${j} class=${j===0?'t':'s'} x=${x+12} y=${y + (vertical?24:28) + j*(vertical?17:19)}>${l}</text>`)}</g>`;
  const [gx, gy] = pos(2), [cx, cy] = pos(4);
  return html`<svg class=${'flow '+(vertical?'flow-v':'flow-h')} viewBox=${`0 0 ${vbW} ${vbH}`} role="img" aria-label="How Nomen works: clauses, meaning as numbers, groups, names, coherence; a name you give regroups every clause">
    <defs><marker id=${'ah'+(vertical?'v':'h')} viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dim)"/></marker>
      <marker id=${'ay'+(vertical?'v':'h')} viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--gold)"/></marker></defs>
    ${stages.map((s,i)=>{ const [x,y]=pos(i); return box(x, y, W, Hh, s, 'b'+i); })}
    ${stages.slice(0,-1).map((_,i)=>{ const [x,y]=pos(i); return vertical
      ? html`<line key=${'a'+i} class="arrow" x1=${x+W/2} y1=${y+Hh+2} x2=${x+W/2} y2=${y+Hh+gap-3} marker-end=${`url(#ahv)`}/>`
      : html`<line key=${'a'+i} class="arrow" x1=${x+W+2} y1=${y+Hh/2} x2=${x+W+gap-3} y2=${y+Hh/2} marker-end=${`url(#ahh)`}/>`; })}
    ${box(youXY[0], youXY[1], youW, youH, you, 'you', 'you')}
    ${vertical
      ? html`<${React.Fragment}>
          <line class="loop" x1=${cx+W/2} y1=${cy+Hh+2} x2=${cx+W/2} y2=${youXY[1]-3} marker-end="url(#ayv)"/>
          <path class="loop" d=${`M ${x0+W+2} ${youXY[1]+Hh/2} H ${x0+W+40} V ${gy+Hh/2} H ${x0+W+4}`} marker-end="url(#ayv)"/>
          <text class="s you" x=${x0+W+46} y=${(gy+youXY[1]+Hh)/2} transform=${`rotate(90 ${x0+W+46} ${(gy+youXY[1]+Hh)/2})`} text-anchor="middle">regroups</text><//>`
      : html`<${React.Fragment}>
          <path class="loop" d=${`M ${cx+W/2} ${cy+Hh+2} V ${youXY[1]+youH/2} H ${youXY[0]+youW+3}`} marker-end="url(#ayh)"/>
          <line class="loop" x1=${gx+W/2} y1=${youXY[1]-2} x2=${gx+W/2} y2=${gy+Hh+3} marker-end="url(#ayh)"/>
          <text class="s you" text-anchor="end" x=${cx+W/2-8} y=${cy+Hh+24}>coherence shows</text><text class="s you" text-anchor="end" x=${cx+W/2-8} y=${cy+Hh+39}>where to look</text><//>`}
  </svg>`;
}

function HowItWorks({data, go}){
  const [ex,setEx] = useState(null);
  useEffect(()=>{ fetch('extraction.json',{headers:{'ngrok-skip-browser-warning':'1'}}).then(r=>r.ok?r.json():null).then(setEx).catch(()=>setEx(null)); },[]);
  const rep = data.report, N = rep.n_provisions;
  const childIds = new Set(data.links.map(l=>l.source));
  const top = data.nodes.filter(n=>n.depth===1).length;
  const leaves = data.nodes.filter(n=>n.depth>0 && !childIds.has(n.id) && n.cohesion!=null && n.count>0);
  const byCoh = [...leaves].sort((a,b)=>b.cohesion-a.cohesion);
  const nLvl = k => leaves.filter(n=>level(n.cohesion)[0]===k).length;
  const times = Math.round(rep.leaf_weighted_purity_pct/rep.baseline_majority_pct*10)/10;
  const curved = rep.geometry==='hyperbolic';
  const nm = s => s==='[naming failed]' ? 'an unnamed group' : '“'+s.replace(/ \(auto\)$/,'')+'”';
  const stages = [
    [`${fmt(N)} clauses`, 'no labels', 'contract text'],
    ['Meaning as numbers', '768 numbers each', 'local model'],
    ['Groups', `${top} branches, split`, `into ${rep.n_leaves} concepts`],
    ['Names', 'a model reads 10', 'clauses per group'],
    ['Coherence', 'how tight each', 'group is'],
  ];
  const you = ['You name a concept (step 2)', 'every clause regroups around your word'];
  return html`<div class="how">
    <p class="intro">Nomen takes <b>${fmt(N)} contract clauses</b> that nobody labelled, groups them by what they mean, and gives each group a short name. Nobody tells it which kinds of clause exist. It finds them.</p>
    <${Flow} stages=${stages} you=${you}/>
    <${Flow} stages=${stages} you=${you} vertical/>

    <section><h3><span class="k">1</span>The input</h3>
      <p>The clauses come from <b>LEDGAR</b>, a public collection of clauses taken from real contracts. People gave each clause one of <b>${rep.n_gold_types} types</b> (for example “Governing Laws” or “Notices”). Nomen never reads those types. The page uses them only after the fact, to score the result: that is the <b>show benchmark labels</b> switch in Discover.</p></section>

    <section><h3><span class="k">2</span>Meaning as numbers</h3>
      <p>A language model that runs on this machine (nomic-embed-text) turns each clause into a list of <b>768 numbers</b>. Clauses that say the same thing get similar numbers, even when they use different words. “Closeness” in the rest of this page means how similar two of these lists are. This step does not send clause text off the machine and it runs once.</p></section>

    <section><h3><span class="k">3</span>How clauses are grouped</h3>
      <p>Nomen splits the clauses from the top down. First all ${fmt(N)} go into <b>${top} branches</b>. Each large branch then splits again, about one sub-group for every 1,500 clauses, for up to 3 levels. Each split uses <b>k-means</b>, a standard method that puts every clause with the group centre nearest to it${curved?html`, on a compressed 48-number copy of each clause placed in a curved (hyperbolic) space`:''}.</p>
      <p>The groups at the bottom of the tree are the <b>${rep.n_leaves} concepts</b>. The branches above them hold related concepts.</p>
      ${curved && html`<p class="note">The project's own tests found that the same split in ordinary flat space gives slightly purer groups (45.4% against 41.2%, measured 2026-10-19). The curved space is the setting this tree was built with.</p>`}</section>

    <section><h3><span class="k">4</span>How each concept gets its name</h3>
      <p>For each group, Nomen takes the <b>10 clauses nearest its centre</b> and sends them to a language model (${rep.name_model}), together with the names of the groups above it. The model must reply with the shortest standard clause heading, 1 to 3 words. So the model reads about 10 clauses per group, ${fmt(rep.n_nodes)} groups in all, and never the whole collection.</p>
      <p>If two groups side by side get the same name, the model is asked again with the taken names listed. If the model gives no answer, Nomen asks again, then asks a second model. As a last resort it makes a name from the clauses' own headings and marks it <b>auto-named</b>. Auto-named groups now: <span class="tv">${rep.naming_failures}</span>.</p>
      <p>Click a concept in Discover to see “the clauses the name came from”.</p></section>

    <section><h3><span class="k">5</span>What coherence measures, and how far to trust a name</h3>
      <p><b>Coherence</b> is the average closeness of every clause in a concept to the concept's centre. A high value means the clauses say nearly the same thing. A low value means the group is a mix. It is measured before any model reads the text and it costs nothing.</p>
      <div class="levels">
        <span class="li"><span class="lvl tight">tight</span><span class="note">${nLvl('tight')} concepts, coherence ${TH.hi} or more</span></span>
        <span class="li"><span class="lvl mixed">mixed</span><span class="note">${nLvl('mixed')} concepts</span></span>
        <span class="li"><span class="lvl loose">loose</span><span class="note">${nLvl('loose')} concepts, below ${TH.lo}</span></span>
      </div>
      <p>The three levels are the top, middle and bottom third of the ${leaves.length} concepts in this tree. Here the tightest is ${nm(byCoh[0].name)} (${byCoh[0].cohesion}) and the loosest is ${nm(byCoh[byCoh.length-1].name)} (${byCoh[byCoh.length-1].cohesion}).</p>
      <p>Coherence follows correctness. Against the benchmark types, the more coherent a concept, the purer it is (rank correlation +0.74 across 83 concepts, where 1 would be perfect).${ex && html` In the governing-law test (step 4 Extract), tight sub-groups gave the right answer <b>${ex.hi_coh_acc}%</b> of the time and loose ones <b>${ex.lo_coh_acc}%</b>.`}</p>
      <p><b>Use it as an order of where to look, not as a probability that a name is right.</b> A tight concept: take the name. A loose one: read its sample clauses before you rely on it, or rename it in Correct.</p></section>

    <section><h3><span class="k">6</span>“${times}× better than guessing”</h3>
      <p>This number uses the benchmark types, only to score. For each concept, <b>purity</b> is the share of its clauses that carry the concept's most common type. Averaged over all clauses, purity is ${rep.leaf_weighted_purity_pct}%.</p>
      <p>The guess to beat: put every clause under the single most common type. That is right for ${rep.baseline_majority_pct}% of clauses.</p>
      <div class="eq"><span class="term good"><b>${rep.leaf_weighted_purity_pct}%</b>purity of Nomen's concepts</span>÷<span class="term"><b>${rep.baseline_majority_pct}%</b>right by guessing</span>=<span class="term good"><b>${times}×</b>better than guessing</span></div>
      ${rep.n_leaves < rep.n_gold_types && html`<p class="note">There are ${rep.n_gold_types} types and ${rep.n_leaves} concepts, so some concepts hold several related types and 100% is not possible here.</p>`}</section>

    <section><h3><span class="k">7</span>“Human decisions”</h3>
      <p>This counts the concept names a person gave in step 2 Correct. Now: <span class="tv">${rep.n_anchors}</span>${(data.anchors||[]).length?html` (${data.anchors.join(', ')})`:''}.</p>
      <p>A name is not a label pasted on a group. Nomen turns your word into numbers with the same model. Every clause that is close enough to your word (0.60 or more) joins the nearest name you gave. The clauses left over are grouped and named by the model again, as in steps 3 and 4. So <b>one word regroups the whole collection</b>, which takes about 2 minutes. You can remove a name (×) or start over at any time.</p></section>

    <section><h3><span class="k">8</span>The four steps</h3>
      <div class="steps">
        <div class="step-card"><h4><span class="k">1</span>Discover</h4><p>The named tree. Open a branch, sort the concepts by coherence or size, and click one to see the clauses its name came from. <b>Map</b> shows the same tree in 3-D.</p><a onClick=${()=>go('discover')}>Open Discover →</a></div>
        <div class="step-card"><h4><span class="k">2</span>Correct</h4><p>Name a concept you know is there, rename a group, or name one of the ${(data.anomalies||[]).length} clauses that fit no group (the clauses farthest from their group's centre). Each change regroups all clauses.</p><a onClick=${()=>go('correct')}>Open Correct →</a></div>
        <div class="step-card"><h4><span class="k">3</span>Find</h4><p>Type a concept. Your words become numbers with the same model and all ${fmt(N)} clauses are ranked by closeness, so paraphrases count. The cards compare that with a plain search for the same words, scored against the benchmark.</p><a onClick=${()=>go('find')}>Open Find →</a></div>
        <div class="step-card"><h4><span class="k">4</span>Extract</h4>${ex ? html`<p>Pull one fact out of the clauses: the US state in a governing-law clause. The ${fmt(ex.n_clauses)} governing-law clauses split into ${ex.k} sub-groups. The model reads one sub-group at a time and every clause in it gets the answer: <b>${ex.cluster_first_acc}%</b> right with ${ex.k} model calls, against <b>${ex.read_all_acc}%</b> when the model reads all ${fmt(ex.read_all_calls)} clauses one by one. Loose sub-groups hold most of the errors, so only those need a closer read.</p>` : html`<p>Pull one fact out of the clauses: the US state in a governing-law clause, one model call per sub-group.</p>`}<a href="extraction.html">Open Extract →</a></div>
      </div>
      <p class="note">Sources: cluster.py (grouping, coherence), naming.py (names), server.py (Find, Correct), docs/RESULTS.md and README.md (measured results).</p></section>
  </div>`;
}

function App(){
  const [data,setData]=useState(null), [err,setErr]=useState(null), [sel,setSel]=useState(null);
  const [tab,setTabRaw]=useState(()=>{ const h=location.hash.slice(1); return TABS.includes(h)?h:'discover'; }), [busy,setBusy]=useState(false), [showBench,setShowBench]=useState(false);
  const [view,setView]=useState('table'), [q,setQ]=useState(''), [change,setChange]=useState(null);
  const mount=useRef(null), fg=useRef(null);
  const setTab = t => { setTabRaw(t); setSel(null); try { history.replaceState(null,'','#'+t); } catch(e){} };
  const applyTree = d => { const childIds=new Set(d.links.map(l=>l.source)); d.nodes.forEach(n=> n._hasChildren=childIds.has(n.id));
    const cs=d.nodes.filter(n=>n.depth>0&&!childIds.has(n.id)&&n.cohesion!=null).map(n=>n.cohesion).sort((a,b)=>a-b);
    if(cs.length>5){ TH={lo:cs[Math.floor(cs.length/3)], hi:cs[Math.floor(2*cs.length/3)]}; }
    setData(d); fg.current=null; };
  useEffect(()=>{ fetch('tree.json?_='+Date.now(),{headers:{'ngrok-skip-browser-warning':'1'}}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}).then(applyTree).catch(e=>setErr(e.message)); },[]);
  useEffect(()=>{ if(view!=='graph'||!data||!mount.current||fg.current) return;
    const g=ForceGraph3D()(mount.current).backgroundColor('rgba(0,0,0,0)')
      .graphData({nodes:data.nodes.map(n=>({...n})),links:data.links.map(l=>({...l}))})
      .nodeId('id').nodeVal(n=>n.human_named?Math.max(60,3*Math.sqrt(n.count||1)):Math.max(1,Math.sqrt(n.count||1))).nodeRelSize(4).nodeColor(colorFor).nodeOpacity(.95)
      .nodeLabel(n=>`<div style="font-size:.8rem"><b>${n.name}</b><br><span style="color:#9aa0aa">${fmt(n.count)} clauses${n.cohesion!=null?' · coherence '+n.cohesion:''}</span></div>`)
      .linkColor(()=> '#4a9eff55').linkWidth(.8).linkOpacity(.35).onNodeClick(n=>setSel(data.nodes.find(x=>x.id===n.id)||n));
    g.d3Force('charge').strength(-120); g.d3Force('link').distance(l=>((l.target&&l.target.human_named)||(l.target&&data.nodes.find(x=>x.id===l.target)?.human_named))?90:30); fg.current=g;
    setTimeout(()=>{ if(fg.current===g) g.zoomToFit(800, 40); }, 1200);   // once the burst has spread, fit the camera so no branch sits outside the view
    const rz=()=>g.width(mount.current.clientWidth).height(mount.current.clientHeight); rz(); window.addEventListener('resize',rz); return ()=>window.removeEventListener('resize',rz);
  },[view,data]);
  const action = async (route, body) => { setBusy(true); setErr(null); try { const t=await post(route,body); applyTree(t); setSel(null); setChange(t.change||null);
      if(t.change && t.change.kind==='added'){ const n=t.nodes.find(x=>x.name===t.change.concept && x.human_named); if(n){ setTabRaw('discover'); setView('table'); setSel(n); } } } catch(e){ setErr(e.message); } finally { setBusy(false); } };
  const openLeaf = name => { const n=data.nodes.find(x=>x.name===name); if(n){ setTab('discover'); setView('table'); setQ(name); setSel(n); } };
  if(err && !data) return html`<div class="hint err" style=${{padding:'2rem'}}>Failed to load: ${err}. Start server.py, then open this page.</div>`;
  if(!data) return html`<div class="hint" style=${{padding:'2rem'}}>loading…</div>`;
  const rep=data.report; const times = Math.round(rep.leaf_weighted_purity_pct/rep.baseline_majority_pct*10)/10;
  return html`<${React.Fragment}>
    <header>
      <div class="brand"><h1>Nomen</h1><span class="tag">finds and names the concepts in ${fmt(rep.n_provisions)} clauses nobody has labelled</span></div>
      <div class="kpis">
        <div class="kpi"><div class="n">${rep.n_leaves}</div><div class="l">concepts found</div></div>
        <div class="kpi"><div class="n">${times}×</div><div class="l">better than guessing</div></div>
        <div class="kpi"><div class="n">${rep.n_anchors}</div><div class="l">human decisions</div></div>
        ${rep.naming_failures>0 && html`<div class="kpi warn"><div class="n">${rep.naming_failures}</div><div class="l">auto-named groups</div></div>`}
      </div>
    </header>
    <nav class="tabs">
      <button class=${tab==='discover'?'on':''} onClick=${()=>setTab('discover')}><span class="step">1</span>Discover</button>
      <button class=${tab==='correct'?'on':''} onClick=${()=>setTab('correct')}><span class="step">2</span>Correct</button>
      <button class=${tab==='find'?'on':''} onClick=${()=>setTab('find')}><span class="step">3</span>Find</button>
      <button class=${tab==='how'?'on':''} onClick=${()=>setTab('how')}>How it works</button>
      <a href="extraction.html"><span class="step">4</span> Extract →</a>
    </nav>
    <div class="main">
      <div class="content">
        ${change && (tab==='discover'||tab==='correct') && html`<div class="change"><span class="x" onClick=${()=>setChange(null)}>×</span>${change.kind==='added'
          ? html`<b>“${change.concept}”</b> now holds ${fmt(change.clauses)} clauses, taken from ${change.from.map(([n,c],i)=>html`<span key=${i}>${i?' · ':''}${n} <b>${fmt(c)}</b></span>`)}`
          : html`<b>“${change.concept}”</b> is gone; its ${fmt(change.clauses)} clauses went to ${change.to.map(([n,c],i)=>html`<span key=${i}>${i?' · ':''}${n} <b>${fmt(c)}</b></span>`)}`}</div>`}
        ${tab==='discover' && html`<${Discover} data=${data} sel=${sel} onSelect=${setSel} showBench=${showBench} setShowBench=${setShowBench} view=${view} setView=${setView} mount=${mount} q=${q} setQ=${setQ}/>`}
        ${tab==='correct' && html`<${Correct} data=${data} action=${action} busy=${busy}/>`}
        ${tab==='find' && html`<${Find} onOpenLeaf=${openLeaf}/>`}
        ${tab==='how' && html`<${HowItWorks} data=${data} go=${setTab}/>`}
      </div>
      <${Panel} node=${sel} onClose=${()=>setSel(null)} onRename=${(id,name)=>action('/rename',{id,name})} busy=${busy} showBench=${showBench}/>
      ${busy && html`<div class="busy"><div class="spinner"></div><div>regrouping the corpus around your words and naming the groups…</div><div class="hint">about 2 minutes</div></div>`}
    </div>
    ${err && html`<div class="hint err">error: ${err}</div>`}
  <//>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
</body>
</html>
